use_default_settings: true

general:
  instance_name: "GetMods Search"
  enable_metrics: false
  contact_url: "https://github.com/sahatanas43000-stack/GetMods-Search"

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true
  center_alignment: true
  infinite_scroll: true
  query_in_title: true
  default_theme: simple
  theme_args:
    simple_style: light

outgoing:
  request_timeout: 3.0
  max_request_timeout: 6.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
